name: Deploy public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap static website if repository is empty
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            git clone --depth 1 https://github.com/minhvima/Phan_tich_diem_Hoc_phan.git /tmp/source-website
            rsync -a --exclude='.git/' --exclude='.github/' /tmp/source-website/web/ ./
            touch .nojekyll
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html assets data .nojekyll
            git commit -m "Publish initial static website"
            git push origin HEAD:main
          fi
      - name: Prepare Pages artifact
        run: |
          mkdir -p /tmp/pages-output
          cp index.html /tmp/pages-output/
          cp -R assets data /tmp/pages-output/
          touch /tmp/pages-output/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-output
      - id: deployment
        uses: actions/deploy-pages@v4
